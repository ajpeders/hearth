[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hearth"
version = "0.1.0"
description = "Offline kitchen voice assistant (companion host app)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "companion @ git+https://github.com/ajpeders/companion.git@v0.6.0",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
